[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    success: Tests for successful responses (200)
    invalid_input: Tests for invalid input errors (400)
    server_error: Tests for server errors (500)
