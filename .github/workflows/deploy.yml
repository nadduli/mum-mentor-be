name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - staging
  pull_request:
    branches:
      - main
      - dev
      - staging
  workflow_dispatch:
    inputs:
      target:
        description: 'Which environment to deploy (staging or production)'
        required: true
        default: 'staging'

jobs:
  test:
    name: Run Tests
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run linting
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Run tests
        run: |
          pip install pytest pytest-asyncio httpx
          pytest -v || echo "No tests found yet"

  deploy:
    name: Deploy to Staging (manual)
    runs-on: self-hosted
    needs: test
    environment: staging
    if: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'staging' }}"
    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e

            cd /var/www/mum-mentor-be-staging

            # Force reset to match remote
            git fetch origin
            git reset --hard origin/staging
            git clean -fd

            # Activate venv and update
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            # Run migrations
            alembic upgrade head

            # Check for systemd unit file in repo and update system unit if changed
            APP_DIR_STAGING="/var/www/mum-mentor-be-staging"
            # candidate unit file names in repo (prefer explicit staging unit if present)
            UNIT_CAND1="$APP_DIR_STAGING/mum-mentor-api-staging.service"
            UNIT_CAND2="$APP_DIR_STAGING/mum-mentor-api.service"
            SYS_UNIT_PATH="/etc/systemd/system/mum-mentor-api-staging.service"
            SKIP_FINAL_RESTART=false

            if [ -f "$UNIT_CAND1" ]; then
              UNIT_PATH="$UNIT_CAND1"
            elif [ -f "$UNIT_CAND2" ]; then
              UNIT_PATH="$UNIT_CAND2"
            else
              UNIT_PATH=""
            fi

            if [ -n "$UNIT_PATH" ]; then
              echo "Unit file found in repo: $UNIT_PATH"
              if [ ! -f "$SYS_UNIT_PATH" ] || ! cmp -s "$UNIT_PATH" "$SYS_UNIT_PATH"; then
                echo "Updating systemd unit file for staging..."
                sudo cp "$UNIT_PATH" "$SYS_UNIT_PATH"
                sudo chown root:root "$SYS_UNIT_PATH"
                sudo chmod 644 "$SYS_UNIT_PATH"
                echo "Reloading systemd daemon..."
                sudo systemctl daemon-reload
                echo "Restarting staging service to pick up new unit..."
                sudo systemctl restart mum-mentor-api-staging
                SKIP_FINAL_RESTART=true
              else
                echo "Systemd unit unchanged for staging."
              fi
            else
              echo "No unit file in repo for staging; skipping unit update."
            fi

            # Restart service if we didn't already restart after updating the unit
            if [ "$SKIP_FINAL_RESTART" = "false" ]; then
              sudo systemctl restart mum-mentor-api-staging
            fi

            sudo systemctl status mum-mentor-api-staging --no-pager

            echo "✅ Deployment to staging completed successfully!"

  deploy-production:
    name: Deploy to Production (manual)
    runs-on: self-hosted
    needs: test
    environment: production
    # Production deploy is currently disabled until the production server is provisioned.
    # Re-enable by changing this condition to the workflow_dispatch check or removing it.
    if: false
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e

            cd /var/www/mum-mentor-be

            # Force reset to match remote main
            git fetch origin
            git reset --hard origin/main
            git clean -fd

            # Activate venv and update
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            # Run migrations
            alembic upgrade head

            # Check for systemd unit file in repo and update system unit if changed
            UNIT_PATH="/var/www/mum-mentor-be/mum-mentor-api.service"
            SYS_UNIT_PATH="/etc/systemd/system/mum-mentor-api.service"
            if [ -f "$UNIT_PATH" ]; then
              if [ ! -f "$SYS_UNIT_PATH" ] || ! cmp -s "$UNIT_PATH" "$SYS_UNIT_PATH"; then
                sudo cp "$UNIT_PATH" "$SYS_UNIT_PATH"
                sudo chown root:root "$SYS_UNIT_PATH"
                sudo chmod 644 "$SYS_UNIT_PATH"
                sudo systemctl daemon-reload
                sudo systemctl restart mum-mentor-api
              fi
            fi

            # Restart service
            sudo systemctl restart mum-mentor-api
            sudo systemctl status mum-mentor-api --no-pager
