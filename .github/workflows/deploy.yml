name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      target:
        description: 'Which environment to deploy (staging or production)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  test:
    name: Run Tests
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for migration checks
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run linting
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Run tests
        run: |
          pip install pytest pytest-asyncio httpx
          pytest -v || echo "No tests found yet"

  # NEW JOB: Migration validation
  validate-migrations:
    name: Validate Database Migrations
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check for multiple migration heads
        id: check_heads
        run: |
          set -e
          echo "🔍 Checking for multiple migration heads..."
          
          HEAD_COUNT=$(alembic heads 2>/dev/null | wc -l)
          
          if [ $HEAD_COUNT -gt 1 ]; then
            echo "❌ ERROR: Multiple migration heads detected!"
            echo ""
            echo "Current heads:"
            alembic heads
            echo ""
            echo "To fix this, run:"
            echo "  alembic merge heads -m 'merge migration heads'"
            echo "  git add alembic/versions/*.py"
            echo "  git commit -m 'Merge alembic migration heads'"
            echo ""
            exit 1
          elif [ $HEAD_COUNT -eq 0 ]; then
            echo "⚠️ WARNING: No migration heads found"
            exit 1
          else
            echo "✅ Single migration head confirmed"
            alembic heads
          fi
      
      - name: Validate migration history
        run: |
          set -e
          echo "🔍 Validating migration chain integrity..."
          
          # Check if history command works (indicates valid migration chain)
          if ! alembic history --verbose > /tmp/migration_history.txt 2>&1; then
            echo "❌ ERROR: Migration history is broken!"
            cat /tmp/migration_history.txt
            exit 1
          fi
          
          echo "✅ Migration chain is valid"
          echo ""
          echo "Recent migrations:"
          alembic history | head -10
      
      - name: Check for missing migration dependencies
        run: |
          set -e
          echo "🔍 Checking migration file imports..."
          
          python << 'PYEOF'
          import os
          import sys
          import importlib.util
          
          migrations_dir = 'alembic/versions'
          errors = []
          
          for filename in sorted(os.listdir(migrations_dir)):
              if filename.endswith('.py') and not filename.startswith('__'):
                  filepath = os.path.join(migrations_dir, filename)
                  spec = importlib.util.spec_from_file_location('migration', filepath)
                  
                  try:
                      module = importlib.util.module_from_spec(spec)
                      # Don't execute, just check if it can be loaded
                      # spec.loader.exec_module(module)
                      print(f"✓ {filename}")
                  except Exception as e:
                      error_msg = f"✗ {filename}: {str(e)}"
                      print(error_msg)
                      errors.append(error_msg)
          
          if errors:
              print("\n❌ Migration import errors found:")
              for error in errors:
                  print(f"  {error}")
              sys.exit(1)
          else:
              print("\n✅ All migration files are valid")
          PYEOF
      
      - name: Verify requirements.txt completeness
        run: |
          set -e
          echo "🔍 Checking if all dependencies are in requirements.txt..."
          
          # Check for common missing dependencies
          MISSING=""
          
          if grep -q "google.auth" alembic/versions/*.py api/**/*.py 2>/dev/null; then
            if ! grep -q "requests" requirements.txt; then
              MISSING="$MISSING\n  - requests (required by google-auth)"
            fi
            if ! grep -q "google-auth" requirements.txt; then
              MISSING="$MISSING\n  - google-auth"
            fi
          fi
          
          if [ -n "$MISSING" ]; then
            echo "⚠️ WARNING: Potentially missing dependencies:"
            echo -e "$MISSING"
            echo ""
            echo "Consider adding these to requirements.txt"
            # Don't fail the build, just warn
          else
            echo "✅ No obvious missing dependencies detected"
          fi

  deploy-staging:
    name: Deploy to Staging (Auto)
    runs-on: self-hosted
    needs: [test, validate-migrations]  # Added migration validation dependency
    environment: staging
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    steps:
      - name: Deploy to staging (password-based)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          APP_DIR: /var/www/mum-mentor-be-staging
        run: |
          set -e

          # Install sshpass (best-effort). Requires sudo on the runner.
          sudo apt-get update || true
          sudo apt-get install -y sshpass || true

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'EOF'
            set -e
            echo "========================================="
            echo "Starting STAGING deployment..."
            echo "========================================="
            
            cd /var/www/mum-mentor-be-staging

            # Backup current state
            echo "📦 Creating backup..."
            BACKUP_DIR="/tmp/staging-backup-$(date +%Y%m%d-%H%M%S)"
            mkdir -p "$BACKUP_DIR"
            cp -r alembic/versions "$BACKUP_DIR/" || true

            # Force reset to match remote
            echo "🔄 Pulling latest code..."
            git fetch origin
            git reset --hard origin/staging
            git clean -fd

            # Activate venv and update
            echo "📦 Installing dependencies..."
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            
            # CRITICAL: Install dependencies that might be missing
            pip install requests google-auth google-auth-httplib2 google-auth-oauthlib

            # Pre-migration checks
            echo "🔍 Checking migration state..."
            
            # Check current database state
            echo "Current database revision:"
            alembic current || echo "No revision tracked yet"
            
            # Check for multiple heads
            HEAD_COUNT=$(alembic heads 2>/dev/null | wc -l)
            echo "Number of heads: $HEAD_COUNT"
            
            if [ $HEAD_COUNT -gt 1 ]; then
              echo "⚠️ Multiple heads detected, upgrading to all heads..."
              alembic upgrade heads || {
                echo "❌ Migration failed!"
                echo "Backup location: $BACKUP_DIR"
                exit 1
              }
            else
              echo "✅ Single head detected, upgrading..."
              # Only stamp if tables already exist (prevents initial migration errors)
              if alembic current 2>&1 | grep -q "Can't locate revision"; then
                echo "🔧 Stamping database to sync with code..."
                alembic stamp head || true
              fi
              
              alembic upgrade head || {
                echo "❌ Migration failed!"
                echo "Backup location: $BACKUP_DIR"
                exit 1
              }
            fi
            
            echo "✅ Migrations completed successfully"
            
            # Show final migration state
            echo "Final database revision:"
            alembic current

            # Restart service
            echo "🔄 Restarting service..."
            sudo systemctl restart mum-mentor-api-staging
            
            # Wait for service to start
            sleep 3
            
            # Check service status
            if sudo systemctl is-active --quiet mum-mentor-api-staging; then
              echo "✅ Service started successfully"
              sudo systemctl status mum-mentor-api-staging --no-pager
            else
              echo "❌ Service failed to start!"
              echo "Recent logs:"
              sudo journalctl -u mum-mentor-api-staging -n 30 --no-pager
              exit 1
            fi

            # Verify application is responding
            echo "🔍 Testing application health..."
            sleep 2
            if curl -f http://localhost:8001/docs > /dev/null 2>&1; then
              echo "✅ Application is responding"
            else
              echo "⚠️ Application may not be responding on port 8001"
              echo "Check logs: sudo journalctl -u mum-mentor-api-staging -f"
            fi

            echo "========================================="
            echo "✅ Staging deployment completed!"
            echo "========================================="
          EOF

  deploy-production:
    name: Deploy to Production (Manual)
    runs-on: self-hosted
    needs: [test, validate-migrations]  # Added migration validation dependency
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production'
    environment: production
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            
            echo "========================================="
            echo "Starting PRODUCTION deployment..."
            echo "========================================="
            
            cd /var/www/mum-mentor-be

            # Backup current state
            echo "📦 Creating backup..."
            BACKUP_DIR="/tmp/production-backup-$(date +%Y%m%d-%H%M%S)"
            mkdir -p "$BACKUP_DIR"
            cp -r alembic/versions "$BACKUP_DIR/" || true
            
            # Backup database (optional but recommended)
            echo "💾 Backing up database..."
            # Uncomment if you want database backups
            # pg_dump $DATABASE_URL > "$BACKUP_DIR/db_backup.sql" || true

            # Force reset to match remote main
            echo "🔄 Pulling latest code..."
            git fetch origin
            git reset --hard origin/main
            git clean -fd

            # Activate venv and update
            echo "📦 Installing dependencies..."
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            
            # Install potentially missing dependencies
            pip install requests google-auth google-auth-httplib2 google-auth-oauthlib

            # Pre-migration checks
            echo "🔍 Checking migration state..."
            
            echo "Current database revision:"
            alembic current
            
            HEAD_COUNT=$(alembic heads 2>/dev/null | wc -l)
            echo "Number of heads: $HEAD_COUNT"
            
            if [ $HEAD_COUNT -gt 1 ]; then
              echo "❌ ERROR: Multiple heads in production!"
              echo "This should have been caught in validation."
              echo "Manual intervention required."
              exit 1
            fi

            # Run migrations
            echo "🔄 Running migrations..."
            alembic upgrade head || {
              echo "❌ Migration failed!"
              echo "Backup location: $BACKUP_DIR"
              exit 1
            }
            
            echo "✅ Migrations completed successfully"
            
            echo "Final database revision:"
            alembic current

            # Restart service
            echo "🔄 Restarting service..."
            sudo systemctl restart mum-mentor-api
            
            sleep 3
            
            if sudo systemctl is-active --quiet mum-mentor-api; then
              echo "✅ Service started successfully"
              sudo systemctl status mum-mentor-api --no-pager
            else
              echo "❌ Service failed to start!"
              sudo journalctl -u mum-mentor-api -n 30 --no-pager
              exit 1
            fi

            # Verify application health
            echo "🔍 Testing application health..."
            sleep 2
            if curl -f http://localhost:8000/docs > /dev/null 2>&1; then
              echo "✅ Application is responding"
            else
              echo "⚠️ Application may not be responding"
            fi

            echo "========================================="
            echo "✅ Production deployment completed!"
            echo "Backup location: $BACKUP_DIR"
            echo "========================================="
