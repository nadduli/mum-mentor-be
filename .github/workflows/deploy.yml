name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      target:
        description: 'Which environment to deploy (staging or production)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  test:
    name: Run Tests
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run linting
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Run tests
        run: |
          pip install pytest pytest-asyncio httpx
          pytest -v || echo "No tests found yet"

  deploy-staging:
    name: Deploy to Staging (Auto)
    runs-on: self-hosted
    needs: test
    environment: staging
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            
            echo "Starting STAGING deployment..."
            cd /var/www/mum-mentor-be-staging

            # Force reset to match remote
            git fetch origin
            git reset --hard origin/staging
            git clean -fd

            # Activate venv and update
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            # Run migrations
            alembic upgrade head

            # Restart service
            sudo systemctl restart mum-mentor-api-staging
            sudo systemctl status mum-mentor-api-staging --no-pager

            echo "✅ Staging deployment completed successfully!"

  deploy-production:
    name: Deploy to Production (Auto)
    runs-on: self-hosted
    needs: test
    environment: production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            
            echo "Starting PRODUCTION deployment..."
            cd /var/www/mum-mentor-be

            # Force reset to match remote main
            git fetch origin
            git reset --hard origin/main
            git clean -fd

            # Activate venv and update
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            # Run migrations
            alembic upgrade head

            # Restart service
            sudo systemctl restart mum-mentor-api
            sudo systemctl status mum-mentor-api --no-pager

            echo "✅ Production deployment completed successfully!"

  deploy-manual:
    name: Deploy (Manual Trigger)
    runs-on: self-hosted
    needs: test
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.target }}
    steps:
      - name: Deploy to selected environment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            
            TARGET="${{ github.event.inputs.target }}"
            
            if [ "$TARGET" = "staging" ]; then
              echo "Manual deployment to STAGING..."
              cd /var/www/mum-mentor-be-staging
              BRANCH="staging"
              SERVICE="mum-mentor-api-staging"
            else
              echo "Manual deployment to PRODUCTION..."
              cd /var/www/mum-mentor-be
              BRANCH="main"
              SERVICE="mum-mentor-api"
            fi

            # Force reset to match remote
            git fetch origin
            git reset --hard origin/$BRANCH
            git clean -fd

            # Activate venv and update
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            # Run migrations
            alembic upgrade head

            # Restart service
            sudo systemctl restart $SERVICE
            sudo systemctl status $SERVICE --no-pager

            echo "✅ Manual deployment to $TARGET completed successfully!"
