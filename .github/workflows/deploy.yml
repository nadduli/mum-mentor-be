name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - staging
  pull_request:
    branches:
      - main
      - dev
      - staging

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run linting
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Run tests
        run: |
          pip install pytest pytest-asyncio httpx
          pytest -v || echo "No tests found yet"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e

            APP_DIR="/var/www/mum-mentor-be"
            REPO_URL="https://${{ secrets.GH_PAT }}@github.com/AdaezeIkemefuna/mum-mentor-be.git"

            # Navigate to app directory
            cd "$APP_DIR"

            # Clone or update repository
            if [ -d ".git" ]; then
              echo "Repository exists, pulling latest changes..."
              git fetch origin
              git checkout dev
              git pull origin dev
            else
              echo "Initializing repository..."
              git init
              git remote add origin "$REPO_URL"
              git fetch origin
              git checkout -b dev origin/dev
            fi

            # Create virtual environment if doesn't exist
            if [ ! -d "venv" ]; then
              echo "Creating virtual environment..."
              python3 -m venv venv
            fi

            # Activate venv and install dependencies
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            # Restart service
            sudo systemctl restart mum-mentor-api

            # Check status
            sudo systemctl status mum-mentor-api --no-pager

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_SERVER_HOST }}
          username: ${{ secrets.STAGING_SERVER_USER }}
          password: ${{ secrets.STAGING_SERVER_PASSWORD }}
          script: |
            cd /var/www/mum-mentor-be-staging
            git pull origin staging
            source venv/bin/activate
            pip install -r requirements.txt
            sudo systemctl restart mum-mentor-api-staging
            sudo systemctl status mum-mentor-api-staging
