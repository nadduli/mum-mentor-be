name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - staging
  pull_request:
    branches:
      - main
      - dev
      - staging
  workflow_dispatch: {}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run linting
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Run tests
        run: |
          pip install pytest pytest-asyncio httpx
          pytest -v || echo "No tests found yet"

  deploy:
    name: Deploy to Production (manual)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            
            APP_DIR="/var/www/mum-mentor-be"
            REPO_URL="https://github.com/hngprojects/mum-mentor-be.git"
            
            # Navigate to app directory
            cd "$APP_DIR"
            
            # Clone or update repository with force reset
            if [ -d ".git" ]; then
              echo "Repository exists, forcing update to match remote..."
              git fetch origin
              git reset --hard origin/dev
              git clean -fd
            else
              echo "Initializing repository..."
              git init
              git remote add origin "$REPO_URL"
              git fetch origin
              git checkout -b dev origin/dev
            fi
            
            # Create virtual environment if doesn't exist
            if [ ! -d "venv" ]; then
              echo "Creating virtual environment..."
              python3 -m venv venv
            fi
            
            # Activate venv and install dependencies
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            
            # Run database migrations
            echo "Running database migrations..."
            alembic upgrade head
            
            # Check for systemd unit file in repo and update system unit if changed
            UNIT_PATH="$APP_DIR/mum-mentor-api.service"
            SYS_UNIT_PATH="/etc/systemd/system/mum-mentor-api.service"
            SKIP_FINAL_RESTART=false

            if [ -f "$UNIT_PATH" ]; then
              echo "Unit file found in repo: $UNIT_PATH"
              if [ ! -f "$SYS_UNIT_PATH" ] || ! cmp -s "$UNIT_PATH" "$SYS_UNIT_PATH"; then
                echo "Updating systemd unit file..."
                sudo cp "$UNIT_PATH" "$SYS_UNIT_PATH"
                sudo chown root:root "$SYS_UNIT_PATH"
                sudo chmod 644 "$SYS_UNIT_PATH"
                echo "Reloading systemd daemon..."
                sudo systemctl daemon-reload
                echo "Restarting service to pick up new unit..."
                sudo systemctl restart mum-mentor-api
                SKIP_FINAL_RESTART=true
              else
                echo "Systemd unit unchanged."
              fi
            else
              echo "No unit file in repo; skipping unit update."
            fi

            # Restart service if we didn't already restart after updating the unit
            if [ "$SKIP_FINAL_RESTART" = "false" ]; then
              echo "Restarting service..."
              sudo systemctl restart mum-mentor-api
            fi
            
            # Check status
            sudo systemctl status mum-mentor-api --no-pager
            
            echo "✅ Deployment completed successfully!"

  deploy-staging:
    name: Deploy to Staging (paused)
    runs-on: ubuntu-latest
    needs: test
    if: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_SERVER_HOST }}
          username: ${{ secrets.STAGING_SERVER_USER }}
          password: ${{ secrets.STAGING_SERVER_PASSWORD }}
          script: |
            set -e
            
            cd /var/www/mum-mentor-be-staging
            
            # Force reset to match remote
            git fetch origin
            git reset --hard origin/staging
            git clean -fd
            
            # Activate venv and update
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            
            # Run migrations
            alembic upgrade head
            
            # Restart service
            sudo systemctl restart mum-mentor-api-staging
            sudo systemctl status mum-mentor-api-staging --no-pager
